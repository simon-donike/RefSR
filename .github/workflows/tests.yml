# .github/workflows/tests.yml
# manual run:
# pytest -q --maxfail=1 --disable-warnings --cov=opensr_srgan  --cov-report=term-missing --cov-report=xml

name: Tests

on:
  push:
    tags:
      - "v*"   # run only on versioned releases like v0.1.0, v1.2.3

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

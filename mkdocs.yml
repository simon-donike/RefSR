site_name: RefSR Docs
site_description: Reference-guided Sentinel-2 + SPOT super-resolution project documentation
site_url: https://example.com
repo_url: https://example.com/RefSR
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - API Reference: api.md
docs_dir: docs
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true